[[capabilities]]
id = "transfer"
description = "Run a cancellable, resumable S3 upload, download, verified copy, or safe move inside a plugin-owned session."
input_schema = "schemas/transfer-input.schema.json"
output_schema = "schemas/transfer-output.schema.json"
permissions = [
    "connection.read",
    "connection.write",
    "local.read",
    "local.write",
    "s3.transfer",
]
risk = "destructive"
destructive = true
streaming = true
execution_mode = "session_only"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 900000

[capabilities.authorization]
declared = true
interactive_execute = true
note = "Bucket, key, local scope, overwrite, multipart, resume, and move constraints are revalidated inside the S3 session."
capability_wide_allowed = false

[[capabilities.authorization.session_purposes]]
kind = "file_transfer"

