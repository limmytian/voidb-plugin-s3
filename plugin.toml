id = "s3"
name = "S3 Object Storage Plugin"
version = "0.3.3"
protocol_version = "1"
description = "Amazon S3 and S3-compatible (MinIO, Cloudflare R2, Ceph) object storage plugin for VoidB."
license = "Apache-2.0"
homepage = "https://github.com/limmytian/voidb-plugin-s3"

[runtime]
command = "voidb-plugin-s3"
args = ["serve"]
transport = "stdio-jsonrpc"

[runtime.env]

[connections]
profile_schema = "schemas/profile.schema.json"
secret_classes = ["cloud_secret_key"]

[[capabilities]]
id = "buckets"
description = "Discover accessible S3 buckets with provider-returned metadata."
input_schema = "schemas/buckets-input.schema.json"
output_schema = "schemas/buckets-output.schema.json"
permissions = [
    "connection.read",
    "s3.buckets",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Bucket and object-prefix constraints are revalidated; multipart work requires the separate FileTransfer session family."
capability_wide_allowed = true

[capabilities.authorization.approval_schema]
version = 1
fields = []

