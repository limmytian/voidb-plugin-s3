name: Plugin Release & Artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release identity (candidate dry runs do not require a tag)
        required: true
        default: v0.3.4
      source_ref:
        description: Exact source commit or branch for a candidate; empty uses release_tag
        required: false
        default: ''
      publish_release:
        description: Publish only after owner review; false uploads candidates without creating tags or releases
        type: boolean
        required: false
        default: false
      recovery_run_id:
        description: Completed release run whose successful platform artifacts should be reused
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref }}
      - name: Select missing platform builds from the exact source commit
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          platforms = [
              {'target': 'x86_64-unknown-linux-gnu', 'os': 'ubuntu-24.04'},
              {'target': 'aarch64-unknown-linux-gnu', 'os': 'ubuntu-24.04-arm'},
              {'target': 'x86_64-apple-darwin', 'os': 'macos-15-intel'},
              {'target': 'aarch64-apple-darwin', 'os': 'macos-15'},
          ]
          run_id = os.environ.get('RECOVERY_RUN_ID')
          if run_id:
              assert run_id.isdigit(), 'Recovery run ID must be numeric'
              repo = os.environ['GITHUB_REPOSITORY']
              previous = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
              source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              assert previous['status'] == 'completed', 'Wait for the original release run to finish'
              assert previous['head_sha'] == source, 'Recovery artifacts must come from the same source commit'
              jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
              successful = {job['name'] for job in jobs if job['conclusion'] == 'success'}
              platforms = [platform for platform in platforms if f"Build & Package ({platform['target']})" not in successful]
              assert platforms, 'No failed platform builds need recovery'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': platforms}) + '\n')
          PY

  build-and-package:
    needs: prepare
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install System Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev zstd tar
      - name: Build Plugin Release Binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Distribution Archives
        run: bash scripts/package-plugin.sh "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*.*

  sign-release-artifacts:
    name: Sign Authenticated Release Payloads
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: plugin-release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse successful exact-source build artifacts
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.recovery_run_id }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install release signing tools
        run: sudo apt-get update && sudo apt-get install -y openssl zstd
      - name: Authenticate and verify complete payloads
        env:
          VOIDB_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.VOIDB_PLUGIN_SIGNING_KEY_PEM }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          plugin="${GITHUB_REPOSITORY#*/voidb-plugin-}"
          python3 scripts/sign-release-artifacts.py dist --plugin-id "$plugin" --version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/*

  publish-github-release:
    if: github.event_name == 'push' || inputs.publish_release == true
    name: Publish New Immutable GitHub Release
    needs: sign-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: dist
      - name: Verify checksums and create a new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          git -C "$GITHUB_WORKSPACE" fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$(git -C "$GITHUB_WORKSPACE" rev-parse "$RELEASE_TAG^{commit}")"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes *
